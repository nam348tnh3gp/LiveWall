name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 8.9 (no wrapper jar needed)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Release build: Compose in a debug APK is several times slower (no R8, extra runtime checks).
      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk LiveWall.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveWall
          path: LiveWall.apk

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LiveWall.apk
